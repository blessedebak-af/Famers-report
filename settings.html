<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farmers Report - Settings & Farmer Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#16A34A",            /* Brand Green */
            "primary-dark": "#052E16",       /* Forest Green */
            "primary-light": "#F0FDF4",      /* Subtle Green Surface */
            "secondary": "#D5A838",          /* Harvest Gold */
            "surface": "#F8FAF7",            /* Off-White Surface */
            "surface-subtle": "#F6F8F5",     /* Subtle Surface */
            "on-surface": "#052E16",         /* Primary Text */
            "on-surface-variant": "#5E6778", /* Muted Text */
            "border-default": "#EBECEF",     /* Border Gray */
            "tertiary-container": "#012D1D"  /* Dark Card Surface */
          },
          fontFamily: {
            "display": ["Hanken Grotesk", "sans-serif"],
            "headline": ["Hanken Grotesk", "sans-serif"],
            "body": ["\"Source Serif 4\"", "serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body overflow-x-hidden min-h-screen flex items-center justify-center">

  <!-- Mobile Outer Shell Container (Flex Column Layout) -->
  <div class="mobile-frame dashboard-container">

    <!-- Header Navigation (Flex Top Child) -->
    <header class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-b border-border-default px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-primary-dark transition-colors">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <img alt="Farmers Report Logo" class="h-7 w-auto object-contain" src="assets/logo.svg">
        <span class="font-headline font-bold text-base text-primary-dark tracking-tight">Settings</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="settings.html" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-xs ring-2 ring-primary/30 overflow-hidden" id="header-avatar-container">
          <span class="material-symbols-outlined text-white text-[16px]" id="header-avatar-icon">person</span>
          <img src="" alt="Avatar" class="w-full h-full object-cover hidden" id="header-avatar-img">
        </a>
      </div>
    </header>

    <!-- Main Content Canvas (Flex-1 Scrollable Area) -->
    <main class="w-full flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-5 scroll-smooth relative">

      <!-- Action Button Area: Confirm Changes -->
      <div class="flex justify-between items-center pt-1">
        <div>
          <h1 class="font-headline text-lg font-bold text-primary-dark">Farmer Profile</h1>
          <p class="font-body text-[11px] text-on-surface-variant">Update account settings & field identity</p>
        </div>
        <button class="bg-primary hover:bg-primary-dark text-white px-4 py-2 rounded-full font-display text-xs font-bold shadow-md active:scale-95 transition-all flex items-center gap-1.5 shrink-0" id="confirm-btn">
          <span class="material-symbols-outlined text-[16px]">check_circle</span>
          <span>Confirm changes</span>
        </button>
      </div>

      <!-- Profile Image Upload Section -->
      <div class="flex flex-col items-center mt-2">
        <div class="relative group">
          <div class="w-28 h-28 rounded-full overflow-hidden shadow-lg ring-4 ring-white border-2 border-primary/20 bg-gray-100">
            <img class="w-full h-full object-cover" id="profile-preview" src="https://images.unsplash.com/photo-1595273670150-bd0c3c392e46?auto=format&fit=crop&w=400&q=80" alt="Farmer Profile Photo">
          </div>
          <button class="absolute bottom-0 right-0 w-9 h-9 bg-secondary text-white rounded-full flex items-center justify-center shadow-md hover:bg-amber-600 active:scale-95 transition-all" onclick="document.getElementById('file-input').click()">
            <span class="material-symbols-outlined text-[18px]">photo_camera</span>
          </button>
          <input accept="image/*" class="hidden" id="file-input" type="file"/>
        </div>
        <p class="mt-2 font-display text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Farmer Profile Photo</p>
      </div>

      <!-- Form Fields Section -->
      <div class="flex flex-col gap-3.5 mb-4">

        <!-- Full Name Field -->
        <div class="bg-white rounded-xl p-3.5 border border-border-default flex flex-col gap-1 shadow-xs transition-all focus-within:border-primary focus-within:shadow-sm">
          <label class="font-display text-[11px] font-bold text-on-surface-variant flex items-center gap-1.5">
            <span class="material-symbols-outlined text-primary text-[16px]">person</span>
            <span>Full Name</span>
          </label>
          <input class="bg-transparent border-b border-gray-200 focus:border-primary outline-none py-1 font-headline text-xs font-semibold text-primary-dark transition-colors" placeholder="Enter full name" type="text" value="Arthur Penhaligon" id="input-fullname"/>
        </div>

        <!-- Speciality Field -->
        <div class="bg-white rounded-xl p-3.5 border border-border-default flex flex-col gap-1 shadow-xs transition-all focus-within:border-primary focus-within:shadow-sm">
          <label class="font-display text-[11px] font-bold text-on-surface-variant flex items-center gap-1.5">
            <span class="material-symbols-outlined text-secondary text-[16px]">agriculture</span>
            <span>Speciality</span>
          </label>
          <div class="relative">
            <select class="w-full bg-transparent border-b border-gray-200 focus:border-primary outline-none py-1 pr-6 font-headline text-xs font-semibold text-primary-dark appearance-none transition-colors cursor-pointer" id="input-speciality">
              <option value="crop-agronomy">Crop Agronomy</option>
              <option value="livestock-management">Livestock Management</option>
              <option value="commodity-trading">Commodity Trading</option>
              <option selected value="soil-science">Soil Science & Irrigation</option>
            </select>
            <span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 text-[18px]">expand_more</span>
          </div>
        </div>

        <!-- Physical Address Field -->
        <div class="bg-white rounded-xl p-3.5 border border-border-default flex flex-col gap-1 shadow-xs transition-all focus-within:border-primary focus-within:shadow-sm">
          <label class="font-display text-[11px] font-bold text-on-surface-variant flex items-center gap-1.5">
            <span class="material-symbols-outlined text-primary text-[16px]">location_on</span>
            <span>Physical Address</span>
          </label>
          <textarea class="bg-transparent border-b border-gray-200 focus:border-primary outline-none py-1 font-headline text-xs font-semibold text-primary-dark resize-none transition-colors" placeholder="Street, City, Zip Code" rows="2" id="input-address">842 Harvest Lane, Central Plains District, IA 50309</textarea>
        </div>

        <!-- Map Location Preview Component -->
        <div class="relative w-full h-28 rounded-xl overflow-hidden border border-border-default shadow-xs group">
          <div class="w-full h-full bg-cover bg-center grayscale opacity-75 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500" style="background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80')"></div>
          <div class="absolute inset-0 bg-gradient-to-t from-primary-dark/70 to-transparent pointer-events-none"></div>
          <div class="absolute bottom-2.5 left-3 flex items-center gap-1.5 text-white">
            <span class="material-symbols-outlined text-secondary text-[16px]">map</span>
            <span class="font-display text-[11px] font-bold">Iowa State Capitol, Des Moines, IA</span>
          </div>
        </div>

      </div>

      <!-- Feedback Toast Notification -->
      <div class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-primary-dark text-white px-4 py-2.5 rounded-full font-display text-xs font-bold shadow-xl opacity-0 pointer-events-none transition-all duration-300 translate-y-4 z-50 flex items-center gap-2 border border-primary/30" id="toast">
        <span class="material-symbols-outlined text-secondary text-[18px]">check_circle</span>
        <span>Profile updated successfully! Redirecting...</span>
      </div>

    </main>

    <!-- Bottom Navigation Bar (Flex Bottom Child) -->
    <nav class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-t border-border-default">
      <div class="flex justify-around items-center h-full px-4">
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary transition-colors" href="dashboard.html">
          <span class="material-symbols-outlined text-[20px]">dashboard</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Dashboard</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary transition-colors" href="new-report.html">
          <span class="material-symbols-outlined text-[20px]">analytics</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Reports</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-primary border-t-2 border-primary" href="settings.html">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-display text-[10px] font-bold mt-0.5">Settings</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('file-input');
      const profilePreview = document.getElementById('profile-preview');
      const fullnameInput = document.getElementById('input-fullname');
      const specialitySelect = document.getElementById('input-speciality');
      const addressTextarea = document.getElementById('input-address');
      const confirmBtn = document.getElementById('confirm-btn');
      const toast = document.getElementById('toast');

      // Load saved state
      const savedName = localStorage.getItem('farmer_fullname');
      const savedSpeciality = localStorage.getItem('farmer_speciality');
      const savedAddress = localStorage.getItem('farmer_address');
      const savedAvatar = localStorage.getItem('farmer_avatar');

      if (savedName && fullnameInput) fullnameInput.value = savedName;
      if (savedSpeciality && specialitySelect) specialitySelect.value = savedSpeciality;
      if (savedAddress && addressTextarea) addressTextarea.value = savedAddress;
      if (savedAvatar && profilePreview) profilePreview.src = savedAvatar;

      // Handle Profile Image Change
      if (fileInput && profilePreview) {
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = (event) => {
              profilePreview.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
          }
        });
      }

      // Handle Confirm Changes Button Action (Persists Data & Updates Dashboard)
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const fullname = fullnameInput.value.trim() || 'Arthur Penhaligon';
          const speciality = specialitySelect.value;
          const address = addressTextarea.value.trim();
          const avatarSrc = profilePreview.src;

          // Save to LocalStorage
          localStorage.setItem('farmer_fullname', fullname);
          localStorage.setItem('farmer_speciality', speciality);
          localStorage.setItem('farmer_address', address);
          localStorage.setItem('farmer_avatar', avatarSrc);

          // Button Loading State
          confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span><span>Saving...</span>';
          confirmBtn.disabled = true;

          setTimeout(() => {
            confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">check_circle</span><span>Confirm changes</span>';
            confirmBtn.disabled = false;
            
            // Show Success Toast
            if (toast) {
              toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
              toast.classList.add('opacity-100', 'translate-y-0');
            }

            // Navigate to Dashboard to reflect user changes on the main screen!
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          }, 800);
        });
      }
    });
  </script>
</body>
</html>
