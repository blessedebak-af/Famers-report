<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farmers Report - New Field Diagnostic Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#16A34A",            /* Brand Green */
            "primary-dark": "#052E16",       /* Forest Green */
            "primary-light": "#F0FDF4",      /* Subtle Green Surface */
            "secondary": "#D5A838",          /* Harvest Gold */
            "surface": "#F8FAF7",            /* Off-White Surface */
            "surface-card": "#FFFFFF",       /* Card White */
            "surface-subtle": "#F6F8F5",     /* Subtle Surface */
            "on-surface": "#052E16",         /* Primary Text */
            "on-surface-variant": "#5E6778", /* Muted Text */
            "border-default": "#EBECEF",     /* Border Gray */
            "tertiary-container": "#012D1D"  /* Dark Card Surface */
          },
          fontFamily: {
            "display": ["Hanken Grotesk", "sans-serif"],
            "headline": ["Hanken Grotesk", "sans-serif"],
            "body": ["\"Source Serif 4\"", "serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body overflow-x-hidden min-h-screen flex items-center justify-center">

  <!-- Mobile Outer Shell Container (Flex Column Layout) -->
  <div class="mobile-frame dashboard-container">

    <!-- Header Navigation (Flex Top Child) -->
    <header class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-b border-border-default px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-primary-dark transition-all active:scale-95">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <img alt="Farmers Report Logo" class="h-7 w-auto object-contain" src="assets/logo.svg">
        <span class="font-headline font-bold text-base text-primary-dark tracking-tight">New Report</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="settings.html" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-xs active:scale-95 transition-all overflow-hidden" id="header-avatar-container">
          <span class="material-symbols-outlined text-white text-[16px]" id="header-avatar-icon">person</span>
          <img src="" alt="Avatar" class="w-full h-full object-cover hidden" id="header-avatar-img">
        </a>
      </div>
    </header>

    <!-- Main Content Canvas (Flex-1 Scrollable Area) -->
    <main class="w-full flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-5 scroll-smooth">

      <!-- Step Progress Indicator Bar -->
      <div class="flex flex-col gap-1.5 pt-1">
        <div class="flex items-center justify-between">
          <span class="font-display text-[11px] font-bold text-primary uppercase tracking-wider">Step <span id="current-step">1</span> of 3</span>
          <span class="font-display text-[11px] text-on-surface-variant font-medium">Diagnostic Setup</span>
        </div>
        <div class="flex gap-1.5 w-full">
          <div class="h-1.5 flex-1 rounded-full bg-primary transition-all duration-300" id="progress-bar-1"></div>
          <div class="h-1.5 flex-1 rounded-full bg-gray-200 transition-all duration-300" id="progress-bar-2"></div>
          <div class="h-1.5 flex-1 rounded-full bg-gray-200 transition-all duration-300" id="progress-bar-3"></div>
        </div>
      </div>

      <!-- Title & Description -->
      <section class="flex flex-col">
        <h1 class="font-headline text-xl font-bold text-primary-dark">Field Diagnostic</h1>
        <p class="font-body text-xs text-on-surface-variant mt-1 leading-relaxed">
          Identify issues in your field or livestock to generate targeted treatment recommendations.
        </p>
      </section>

      <!-- Form Section -->
      <form class="flex flex-col gap-4" id="diagnostic-form" onsubmit="return false;">

        <!-- 1. Diagnostic Type (Radio Buttons: Crop vs Animal) -->
        <div class="flex flex-col gap-2">
          <label class="font-display text-xs font-bold text-primary-dark uppercase tracking-wider">1. Select Diagnostic Type</label>
          <div class="grid grid-cols-2 gap-3">

            <!-- Crop Radio Option -->
            <label class="relative flex flex-col items-center justify-center p-3.5 bg-white border-2 border-border-default rounded-xl cursor-pointer transition-all active:scale-95 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-green-50/60 shadow-xs group">
              <input type="radio" name="diagnostic-type" value="crop" class="sr-only" id="type-crop">
              <span class="material-symbols-outlined text-[28px] text-gray-500 group-has-[:checked]:text-primary mb-1 transition-colors">grass</span>
              <span class="font-headline text-xs font-bold text-gray-700 group-has-[:checked]:text-primary-dark">Crop</span>
              <span class="text-[10px] text-gray-400 font-display mt-0.5">Plants & Fields</span>
            </label>

            <!-- Animal Radio Option -->
            <label class="relative flex flex-col items-center justify-center p-3.5 bg-white border-2 border-border-default rounded-xl cursor-pointer transition-all active:scale-95 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-green-50/60 shadow-xs group">
              <input type="radio" name="diagnostic-type" value="animal" class="sr-only" id="type-animal">
              <span class="material-symbols-outlined text-[28px] text-gray-500 group-has-[:checked]:text-primary mb-1 transition-colors">pets</span>
              <span class="font-headline text-xs font-bold text-gray-700 group-has-[:checked]:text-primary-dark">Animal</span>
              <span class="text-[10px] text-gray-400 font-display mt-0.5">Livestock & Poultry</span>
            </label>

          </div>
        </div>

        <!-- 2. Category Selection (Radio Buttons: Pests vs Disease) -->
        <div class="flex flex-col gap-2 opacity-50 pointer-events-none transition-all duration-300" id="category-container">
          <label class="font-display text-xs font-bold text-primary-dark uppercase tracking-wider">2. Issue Category</label>
          <div class="grid grid-cols-2 gap-3">

            <!-- Pests Radio Option -->
            <label class="relative flex flex-col items-center justify-center p-3 bg-white border-2 border-border-default rounded-xl cursor-pointer transition-all active:scale-95 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-green-50/60 shadow-xs group">
              <input type="radio" name="category-type" value="pests" class="sr-only" id="cat-pests">
              <span class="material-symbols-outlined text-[24px] text-gray-500 group-has-[:checked]:text-primary mb-1 transition-colors">bug_report</span>
              <span class="font-headline text-xs font-bold text-gray-700 group-has-[:checked]:text-primary-dark">Pests</span>
            </label>

            <!-- Disease Radio Option -->
            <label class="relative flex flex-col items-center justify-center p-3 bg-white border-2 border-border-default rounded-xl cursor-pointer transition-all active:scale-95 hover:border-primary/50 has-[:checked]:border-primary has-[:checked]:bg-green-50/60 shadow-xs group">
              <input type="radio" name="category-type" value="disease" class="sr-only" id="cat-disease">
              <span class="material-symbols-outlined text-[24px] text-gray-500 group-has-[:checked]:text-primary mb-1 transition-colors">coronavirus</span>
              <span class="font-headline text-xs font-bold text-gray-700 group-has-[:checked]:text-primary-dark">Disease</span>
            </label>

          </div>
        </div>

        <!-- 3. Target Host / Target Selector Dropdown -->
        <div class="flex flex-col gap-1.5 opacity-50 pointer-events-none transition-all duration-300" id="host-container">
          <label class="font-display text-xs font-bold text-primary-dark uppercase tracking-wider" id="host-label">3. Select Target Subject</label>
          <div class="relative bg-white rounded-xl border border-border-default focus-within:border-primary transition-all shadow-xs overflow-hidden">
            <select class="w-full bg-transparent py-3 px-3.5 pr-10 font-headline text-xs font-semibold text-primary-dark appearance-none focus:outline-none cursor-pointer" id="host-select">
              <option value="" disabled selected>Select Subject</option>
            </select>
            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 text-[20px]">expand_more</span>
          </div>
        </div>

        <!-- 4. Specific Ailment / Symptom Selection Dropdown -->
        <div class="flex flex-col gap-1.5 opacity-50 pointer-events-none transition-all duration-300" id="ailment-container">
          <label class="font-display text-xs font-bold text-primary-dark uppercase tracking-wider" id="ailment-label">4. Specific Ailment / Symptom</label>
          <div class="relative bg-white rounded-xl border border-border-default focus-within:border-primary transition-all shadow-xs overflow-hidden">
            <select class="w-full bg-transparent py-3 px-3.5 pr-10 font-headline text-xs font-semibold text-primary-dark appearance-none focus:outline-none cursor-pointer" id="ailment-select">
              <option value="" disabled selected>Select Specific Ailment</option>
            </select>
            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400 text-[20px]">expand_more</span>
          </div>
        </div>

        <!-- Submit Action Button with Smooth Mobile Tap Scale -->
        <div class="pt-3 pb-4">
          <button class="w-full h-12 bg-gray-200 text-gray-500 font-display text-xs font-bold rounded-full shadow-xs flex items-center justify-center gap-2 transition-all active:scale-95 cursor-not-allowed uppercase tracking-wider" disabled id="continue-btn">
            <span>REPORT</span>
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          </button>
        </div>

      </form>

    </main>

    <!-- Bottom Navigation Bar (Flex Bottom Child) -->
    <nav class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-t border-border-default">
      <div class="flex justify-around items-center h-full px-4">
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary active:scale-95 transition-all" href="dashboard.html">
          <span class="material-symbols-outlined text-[20px]">dashboard</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Dashboard</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-primary border-t-2 border-primary active:scale-95 transition-all" href="new-report.html">
          <span class="material-symbols-outlined text-[20px]">analytics</span>
          <span class="font-display text-[10px] font-bold mt-0.5">Reports</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary active:scale-95 transition-all" href="settings.html">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Settings</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    (function() {
      const typeInputs = document.querySelectorAll('input[name="diagnostic-type"]');
      const categoryInputs = document.querySelectorAll('input[name="category-type"]');
      const hostSelect = document.getElementById('host-select');
      const ailmentSelect = document.getElementById('ailment-select');

      const categoryContainer = document.getElementById('category-container');
      const hostContainer = document.getElementById('host-container');
      const ailmentContainer = document.getElementById('ailment-container');
      const hostLabel = document.getElementById('host-label');
      const ailmentLabel = document.getElementById('ailment-label');
      const continueBtn = document.getElementById('continue-btn');

      const progressBar1 = document.getElementById('progress-bar-1');
      const progressBar2 = document.getElementById('progress-bar-2');
      const progressBar3 = document.getElementById('progress-bar-3');
      const stepText = document.getElementById('current-step');

      // Sync avatar from settings
      const savedAvatar = localStorage.getItem('farmer_avatar');
      const avatarIcon = document.getElementById('header-avatar-icon');
      const avatarImg = document.getElementById('header-avatar-img');
      if (savedAvatar && avatarImg && avatarIcon) {
        avatarImg.src = savedAvatar;
        avatarImg.classList.remove('hidden');
        avatarIcon.classList.add('hidden');
      }

      const dataStore = {
        crop: {
          pests: {
            label: 'Select Crop Field',
            hosts: {
              'Corn Field': [
                'Corn Borer (Stalk damage)',
                'Fall Armyworm (Foliage destruction)',
                'Corn Rootworm (Root damage)'
              ],
              'Wheat Field': [
                'Wheat Aphids (Sap sucking)',
                'Hessian Fly (Stunting)',
                'Cereal Leaf Beetle'
              ],
              'Soybean Field': [
                'Soybean Aphids',
                'Stink Bugs (Pod damage)',
                'Japanese Beetles'
              ],
              'Rice Field': [
                'Stem Borers',
                'Rice Hispa',
                'Green Leafhoppers'
              ]
            }
          },
          disease: {
            label: 'Select Crop Field',
            hosts: {
              'Corn Field': [
                'Northern Corn Leaf Blight (Grey lesions)',
                'Grey Leaf Spot (Rectangular lesions)',
                'Common Rust (Pustules on leaves)'
              ],
              'Wheat Field': [
                'Stripe Rust (Yellow pustules)',
                'Fusarium Head Blight (Bleached heads)',
                'Powdery Mildew (White fungus)'
              ],
              'Soybean Field': [
                'Sudden Death Syndrome (Foliar chlorosis)',
                'Brown Stem Rot',
                'Frogeye Leaf Spot'
              ],
              'Rice Field': [
                'Rice Blast (Diamond-shaped spots)',
                'Sheath Blight',
                'Bacterial Leaf Blight'
              ]
            }
          }
        },
        animal: {
          pests: {
            label: 'Select Livestock Group',
            hosts: {
              'Cattle Herd': [
                'Lone Star Ticks (Blood feeding)',
                'Horn Flies (Stress & weight loss)',
                'Screwworm Maggots'
              ],
              'Poultry Flock': [
                'Poultry Mites (Feather loss & anemia)',
                'Lice Infestation',
                'Fleas (Sticktight fleas)'
              ],
              'Swine Herd': [
                'Mange Mites (Severe skin itching)',
                'Hog Lice (Skin lesions)',
                'Biting Flies'
              ],
              'Goats & Sheep': [
                'Keds (Wingless flies)',
                'Nasal Bot Flies',
                'Sarcoptic Mange'
              ]
            }
          },
          disease: {
            label: 'Select Livestock Group',
            hosts: {
              'Cattle Herd': [
                'Bovine Respiratory Disease (Shipping fever)',
                'Foot Rot (Interdigital swelling)',
                'Infectious Bovine Keratoconjunctivitis (Pinkeye)'
              ],
              'Poultry Flock': [
                'Avian Influenza (High mortality)',
                'Coccidiosis (Bloody enteritis)',
                'Newcastle Disease'
              ],
              'Swine Herd': [
                'Swine Influenza (Coughing & fever)',
                'Porcine Epidemic Diarrhea (PEDv)',
                'Erysipelas (Diamond skin lesions)'
              ],
              'Goats & Sheep': [
                'Peste des Petits Ruminants (PPR)',
                'Contagious Ecthyma (Orf / Sore mouth)',
                'Foot Rot'
              ]
            }
          }
        }
      };

      function updateContainer(el, show) {
        if (show) {
          el.classList.remove('opacity-50', 'pointer-events-none');
          el.classList.add('opacity-100');
        } else {
          el.classList.add('opacity-50', 'pointer-events-none');
          el.classList.remove('opacity-100');
        }
      }

      function getSelectedValue(inputs) {
        for (let input of inputs) {
          if (input.checked) return input.value;
        }
        return null;
      }

      typeInputs.forEach(input => {
        input.addEventListener('change', () => {
          updateContainer(categoryContainer, true);
          categoryInputs.forEach(i => i.checked = false);
          hostSelect.innerHTML = '<option value="" disabled selected>Select Subject</option>';
          ailmentSelect.innerHTML = '<option value="" disabled selected>Select Specific Ailment</option>';
          updateContainer(hostContainer, false);
          updateContainer(ailmentContainer, false);

          stepText.textContent = '1';
          progressBar1.classList.replace('bg-gray-200', 'bg-primary');
          progressBar2.classList.replace('bg-primary', 'bg-gray-200');
          progressBar3.classList.replace('bg-primary', 'bg-gray-200');

          checkForm();
        });
      });

      categoryInputs.forEach(input => {
        input.addEventListener('change', () => {
          const type = getSelectedValue(typeInputs);
          const cat = getSelectedValue(categoryInputs);

          if (type && cat) {
            const dataGroup = dataStore[type][cat];
            hostLabel.textContent = `3. ${dataGroup.label}`;
            
            hostSelect.innerHTML = `<option value="" disabled selected>${dataGroup.label}</option>`;
            Object.keys(dataGroup.hosts).forEach(host => {
              const opt = document.createElement('option');
              opt.value = host;
              opt.textContent = host;
              hostSelect.appendChild(opt);
            });

            updateContainer(hostContainer, true);
            ailmentSelect.innerHTML = '<option value="" disabled selected>Select Specific Ailment</option>';
            updateContainer(ailmentContainer, false);

            stepText.textContent = '2';
            progressBar2.classList.replace('bg-gray-200', 'bg-primary');
            progressBar3.classList.replace('bg-primary', 'bg-gray-200');
          }
          checkForm();
        });
      });

      hostSelect.addEventListener('change', () => {
        const type = getSelectedValue(typeInputs);
        const cat = getSelectedValue(categoryInputs);
        const host = hostSelect.value;

        if (type && cat && host) {
          const ailments = dataStore[type][cat].hosts[host];
          ailmentLabel.textContent = `4. Select Specific ${cat === 'pests' ? 'Pest Infestation' : 'Disease Symptom'}`;

          ailmentSelect.innerHTML = `<option value="" disabled selected>Select Ailment / Symptom</option>`;
          ailments.forEach(ail => {
            const opt = document.createElement('option');
            opt.value = ail;
            opt.textContent = ail;
            ailmentSelect.appendChild(opt);
          });

          updateContainer(ailmentContainer, true);
          stepText.textContent = '3';
          progressBar3.classList.replace('bg-gray-200', 'bg-primary');
        }
        checkForm();
      });

      ailmentSelect.addEventListener('change', checkForm);

      function checkForm() {
        const type = getSelectedValue(typeInputs);
        const cat = getSelectedValue(categoryInputs);
        const host = hostSelect.value;
        const ailment = ailmentSelect.value;

        if (type && cat && host && ailment) {
          continueBtn.disabled = false;
          continueBtn.classList.remove('bg-gray-200', 'text-gray-500', 'cursor-not-allowed');
          continueBtn.classList.add('bg-primary', 'text-white', 'hover:bg-primary-dark', 'cursor-pointer', 'shadow-md', 'active:scale-95');
        } else {
          continueBtn.disabled = true;
          continueBtn.classList.add('bg-gray-200', 'text-gray-500', 'cursor-not-allowed');
          continueBtn.classList.remove('bg-primary', 'text-white', 'hover:bg-primary-dark', 'cursor-pointer', 'shadow-md', 'active:scale-95');
        }
      }

      continueBtn.addEventListener('click', () => {
        if (!continueBtn.disabled) {
          const reportData = {
            id: '#FR-' + Math.floor(1000 + Math.random() * 9000),
            subject: hostSelect.value || 'Corn Field',
            issue: ailmentSelect.value || 'Corn Borer (Stalk damage)',
            type: getSelectedValue(typeInputs) || 'crop',
            category: getSelectedValue(categoryInputs) || 'pests',
            date: 'Just now',
            status: 'Pending'
          };

          // Save report to LocalStorage
          localStorage.setItem('latest_report', JSON.stringify(reportData));
          
          let existingReports = JSON.parse(localStorage.getItem('reports_list') || '[]');
          existingReports.unshift(reportData);
          localStorage.setItem('reports_list', JSON.stringify(existingReports));

          continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>SAVING REPORT...</span>';
          setTimeout(() => {
            window.location.href = 'report-confirmation.html';
          }, 600);
        }
      });
    })();
  </script>
</body>
</html>
