<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farmers Report - Report Confirmation</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#16A34A",            /* Brand Green */
            "primary-dark": "#052E16",       /* Forest Green */
            "primary-light": "#F0FDF4",      /* Subtle Green Surface */
            "secondary": "#D5A838",          /* Harvest Gold */
            "surface": "#F8FAF7",            /* Off-White Surface */
            "surface-card": "#FFFFFF",       /* Card White */
            "surface-subtle": "#F6F8F5",     /* Subtle Surface */
            "on-surface": "#052E16",         /* Primary Text */
            "on-surface-variant": "#5E6778", /* Muted Text */
            "border-default": "#EBECEF",     /* Border Gray */
            "tertiary-container": "#012D1D"  /* Dark Card Surface */
          },
          fontFamily: {
            "display": ["Hanken Grotesk", "sans-serif"],
            "headline": ["Hanken Grotesk", "sans-serif"],
            "body": ["\"Source Serif 4\"", "serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body overflow-x-hidden min-h-screen flex items-center justify-center">

  <!-- Mobile Outer Shell Container (Flex Column Layout) -->
  <div class="mobile-frame dashboard-container">

    <!-- Header Navigation (Flex Top Child) -->
    <header class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-b border-border-default px-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="flex items-center justify-center w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 text-primary-dark active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </a>
        <img alt="Farmers Report Logo" class="h-7 w-auto object-contain" src="assets/logo.svg">
        <span class="font-headline font-bold text-base text-primary-dark tracking-tight">Confirmation</span>
      </div>
      <div class="flex items-center gap-2">
        <a href="settings.html" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-xs active:scale-95 transition-all overflow-hidden" id="header-avatar-container">
          <span class="material-symbols-outlined text-white text-[16px]" id="header-avatar-icon">person</span>
          <img src="" alt="Avatar" class="w-full h-full object-cover hidden" id="header-avatar-img">
        </a>
      </div>
    </header>

    <!-- Main Content Canvas (Flex-1 Centered Confirmation Content) -->
    <main class="w-full flex-1 overflow-y-auto px-5 py-6 flex flex-col items-center justify-center text-center gap-6 scroll-smooth">

      <!-- Large Tick Icon in Green Background -->
      <div class="relative flex items-center justify-center">
        <!-- Pulse Glow Ring -->
        <div class="absolute w-28 h-28 rounded-full bg-green-100 animate-ping opacity-30"></div>
        <!-- Main Green Circle with Tick -->
        <div class="w-24 h-24 rounded-full bg-primary flex items-center justify-center text-white shadow-xl relative z-10 border-4 border-white">
          <span class="material-symbols-outlined text-[54px] font-bold">check</span>
        </div>
      </div>

      <!-- Confirmation Headline & Requested Copy -->
      <div class="flex flex-col gap-2 max-w-[280px]">
        <h1 class="font-headline text-2xl font-bold text-primary-dark">Report Logged!</h1>
        <p class="font-headline text-sm font-semibold text-on-surface-variant leading-relaxed">
          Your report has been logged and will be reviewed
        </p>
      </div>

      <!-- Logged Report Summary Card (Dynamically populated from LocalStorage!) -->
      <div class="w-full bg-white rounded-2xl p-4 border border-border-default shadow-xs flex flex-col gap-2 text-left">
        <div class="flex items-center justify-between border-b border-border-default pb-2">
          <span class="font-display text-[10px] font-bold text-gray-400 uppercase tracking-wider">Report ID</span>
          <span class="font-headline text-xs font-bold text-primary" id="summary-id">#FR-8492</span>
        </div>
        <div class="flex flex-col gap-1 pt-1">
          <div class="flex justify-between items-center text-xs">
            <span class="font-display text-on-surface-variant">Subject:</span>
            <span class="font-headline font-semibold text-primary-dark" id="summary-subject">Corn Field</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="font-display text-on-surface-variant">Issue:</span>
            <span class="font-headline font-semibold text-primary-dark" id="summary-issue">Corn Borer (Stalk damage)</span>
          </div>
          <div class="flex justify-between items-center text-xs">
            <span class="font-display text-on-surface-variant">Status:</span>
            <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 font-display text-[9px] font-bold uppercase tracking-wider">Pending Review</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons with Tactile Mobile Tap Animations -->
      <div class="w-full flex flex-col gap-2.5 pt-2">
        <a href="dashboard.html" class="w-full h-12 bg-primary text-white font-display text-xs font-bold rounded-full shadow-md flex items-center justify-center gap-2 hover:bg-primary-dark active:scale-95 transition-all uppercase tracking-wider">
          <span>BACK TO DASHBOARD</span>
          <span class="material-symbols-outlined text-[18px]">home</span>
        </a>

        <a href="new-report.html" class="w-full h-11 bg-white text-primary border-2 border-primary font-display text-xs font-bold rounded-full shadow-xs flex items-center justify-center gap-2 hover:bg-green-50 active:scale-95 transition-all uppercase tracking-wider">
          <span>SUBMIT ANOTHER REPORT</span>
          <span class="material-symbols-outlined text-[18px]">add</span>
        </a>
      </div>

    </main>

    <!-- Bottom Navigation Bar (Flex Bottom Child) -->
    <nav class="w-full h-16 shrink-0 z-30 bg-white/95 backdrop-blur-xl border-t border-border-default">
      <div class="flex justify-around items-center h-full px-4">
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary active:scale-95 transition-all" href="dashboard.html">
          <span class="material-symbols-outlined text-[20px]">dashboard</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Dashboard</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-primary border-t-2 border-primary active:scale-95 transition-all" href="new-report.html">
          <span class="material-symbols-outlined text-[20px]">analytics</span>
          <span class="font-display text-[10px] font-bold mt-0.5">Reports</span>
        </a>
        <a class="flex flex-col items-center justify-center flex-1 h-full text-on-surface-variant hover:text-primary active:scale-95 transition-all" href="settings.html">
          <span class="material-symbols-outlined text-[20px]">settings</span>
          <span class="font-display text-[10px] font-medium mt-0.5">Settings</span>
        </a>
      </div>
    </nav>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Sync Avatar
      const savedAvatar = localStorage.getItem('farmer_avatar');
      const avatarIcon = document.getElementById('header-avatar-icon');
      const avatarImg = document.getElementById('header-avatar-img');
      if (savedAvatar && avatarImg && avatarIcon) {
        avatarImg.src = savedAvatar;
        avatarImg.classList.remove('hidden');
        avatarIcon.classList.add('hidden');
      }

      // Populate latest submitted report from LocalStorage
      const latestRaw = localStorage.getItem('latest_report');
      if (latestRaw) {
        try {
          const latest = JSON.parse(latestRaw);
          if (latest.id) document.getElementById('summary-id').textContent = latest.id;
          if (latest.subject) document.getElementById('summary-subject').textContent = latest.subject;
          if (latest.issue) document.getElementById('summary-issue').textContent = latest.issue;
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
