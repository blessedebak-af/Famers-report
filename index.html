<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farmer's report</title>
  <meta name="theme-color" content="#16A34A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farmer's report">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-surface text-on-surface font-body overflow-x-hidden min-h-screen flex items-center justify-center">

  <!-- Mobile Shell Container -->
  <div class="mobile-frame">

    <!-- Splash Screen Centered Content Canvas -->
    <main class="splash-content">

      <!-- Elevated White Logo Card -->
      <div class="logo-card">
        <img src="assets/logo.svg" alt="Farmer's report Logo" class="logo-img">
      </div>

      <!-- Title & Subtitle -->
      <div class="title-group">
        <h1 class="app-title">Farmer's report</h1>
        <p class="app-subtitle">Smart Agricultural Intelligence & Diagnostics</p>
      </div>

      <!-- Dark Horizontal Line Divider -->
      <div class="line-divider"></div>

      <!-- Action Button Area: Solid Green Pill Button with Black Border -->
      <div class="action-group">
        <button id="welcome-btn" class="btn-fill">
          <span class="btn-text">WELCOME BACK.</span>
          <span class="material-symbols-outlined sync-icon">sync</span>
        </button>
      </div>

    </main>

  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
