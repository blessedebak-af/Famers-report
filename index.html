<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Farmer's report</title>
  <meta name="theme-color" content="#16A34A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Farmer's report">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mobile Shell Wrapper -->
  <div class="mobile-frame">
    <!-- Top Decorative Gradient Header bar -->
    <div class="top-bar"></div>

    <!-- Main Splash Screen Canvas -->
    <main class="splash-container">
      <!-- Background SVG Contour Paths -->
      <div class="bg-contours">
        <svg viewBox="0 0 400 400" preserveAspectRatio="none" class="contour-svg">
          <path d="M-50,200 Q100,50 250,220 T500,200 L500,500 L-50,500 Z" fill="#012D1D" opacity="0.04" />
          <path d="M-20,280 Q150,150 300,310 T550,250 L550,500 L-20,500 Z" fill="#012D1D" opacity="0.06" />
          <path d="M-50,100 Q150,300 350,120 T550,180 L550,0 L-50,0 Z" fill="#012D1D" opacity="0.03" />
        </svg>
      </div>

      <!-- Center Branding Logo & Identity -->
      <div class="brand-center flex flex-col items-center justify-center">
        <div class="logo-wrapper animate-fade-in mb-4">
          <img src="assets/logo.svg" alt="Farmer's report Logo" class="brand-logo" width="140" height="140" />
        </div>
        <h1 class="brand-title">Farmer's report</h1>
        <p class="brand-subtitle">Smart Agricultural Intelligence & Diagnostics</p>
      </div>

      <!-- Action Button Area: Solid Green Pill Button per Spec -->
      <div class="action-footer">
        <button id="welcome-btn" class="welcome-fill-btn active:scale-95 transition-transform duration-200 cursor-pointer">
          <span class="btn-text">WELCOME BACK.</span>
          <span class="material-symbols-outlined icon-sync">sync</span>
        </button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
